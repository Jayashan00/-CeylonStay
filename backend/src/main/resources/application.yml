server:
  port: 8080

spring:
  application:
    name: ceylonstay-backend
  data:
    mongodb:
      uri: mongodb://localhost:27017/ceylonstay
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ceylonstay-super-secret-key-for-jwt-signing-change-in-production-2026
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  upload-dir: uploads
  base-url: http://localhost:8080

logging:
  level:
    com.ceylonstay: INFO